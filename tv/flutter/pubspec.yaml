name: kinkit_tv
description: View-only Kinkit dashboard for Android TV, Google TV and Fire TV.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Kiki the mascot (brand/mascot*.svg rendered without the baked-in shadow; lib/src/mascot.dart draws it).
    - assets/mascot/
