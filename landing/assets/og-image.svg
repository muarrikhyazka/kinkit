  <text x="80" y="510" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#e0e7ff">Money, chores, reminders, calendar and meals, shared by the family.</text>
  <text x="80" y="556" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#e0e7ff">Log spending from Telegram, Discord, Slack or Matrix.</text>
