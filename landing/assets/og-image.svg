<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Flat app-chrome purple, same as the landing top bar; the soft second line mirrors the hero headline. -->
  <rect width="1200" height="630" fill="#4f46e5"/>
  <g transform="translate(80 90)">
    <g transform="scale(1.5)"><rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="1.5"/><path d="M14 31 32 16l18 15" fill="none" stroke="#4F46E5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 28v18a3 3 0 0 0 3 3h20a3 3 0 0 0 3-3V28" fill="none" stroke="#4F46E5" stroke-width="5" stroke-linejoin="round"/><circle cx="32" cy="39" r="5.5" fill="#4F46E5"/></g>
    <text x="124" y="66" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#fff">Kinkit</text>
